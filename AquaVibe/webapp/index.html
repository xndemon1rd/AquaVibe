<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AquaVibe Games</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#07111d;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:14px;overflow:hidden}.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(28px,8vw,60px);cursor:pointer}.sq:nth-child(odd){background:#d8c39b}.sq:nth-child(even){background:#5d6b73}.info{padding:12px;border-radius:12px;background:#102235;margin:10px 0}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{padding:12px;border-radius:10px;background:#fff;color:#111;min-width:70px}</style></head><body><div class="wrap"><div id="app" class="info">Loading…</div></div><script>
const path=location.pathname.split('/').filter(Boolean), kind=path[0]||'home', id=path[1]||''; const tg=window.Telegram&&Telegram.WebApp; if(tg)tg.ready(); const uid=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:0; const headers=tg&&tg.initData?{'X-Telegram-Init-Data':tg.initData}:{};
async function j(u,o={}){o.headers={...(o.headers||{}),...headers,'content-type':'application/json'};let r=await fetch(u,o);return r.json()}
const piece={P:'♟',N:'♞',B:'♝',R:'♜',Q:'♛',K:'♚',p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
function fenBoard(f){let rows=f.split(' ')[0].split('/'),a=[];for(let r of rows){for(let c of r){if(/\d/.test(c))a.push(...Array(Number(c)).fill(''));else a.push(piece[c]||c)}}return a}
async function chess(){let d=await j('/api/chess/'+id);if(d.error){app.innerText=d.error;return}let b=fenBoard(d.fen);app.innerHTML='<h2>♟️ Aqua Chess</h2><div class="info">Turn: '+d.turn+'</div><div id="board" class="board"></div>';let board=document.getElementById('board');b.forEach((p,i)=>{let x=document.createElement('div');x.className='sq';x.textContent=p;x.onclick=()=>move(i);board.appendChild(x)});window._ch=d}
let selected=null;async function move(i){if(selected===null){selected=i;return}let files='abcdefgh';let fr=files[selected%8]+(8-Math.floor(selected/8)),to=files[i%8]+(8-Math.floor(i/8));let d=await j('/api/chess/'+id+'/move',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({move:fr+to})});selected=null;if(d.error)alert(d.error);else chess()}
async function uno(){let d=await j('/api/uno/'+id);if(d.error){app.innerText=d.error;return}app.innerHTML='<h2>🃏 Aqua UNO</h2><div class="info">Top card: '+(d.top||'—')+' • Turn: '+(d.turn??'—')+'</div><p>Join/play is handled by the lobby API. Open this app with Telegram user_id for full player controls.</p>'}
if(kind==='chess')chess();else if(kind==='uno')uno();else app.innerHTML='<h2>🌊 AquaVibe Games</h2><p>Choose Chess or UNO from the bot.</p>';
</script></body></html>
